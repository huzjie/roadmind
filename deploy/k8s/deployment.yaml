apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roadmind
  template:
    metadata:
      labels:
        app: roadmind
    spec:
      containers:
        - name: roadmind
          image: roadmind:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
